name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cobol-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install GnuCOBOL
        run: sudo apt-get update && sudo apt-get install -y gnucobol db5.3-util shellcheck

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile all COBOL sources
        run: |
          cobc -x -free ledger.cbl sha256.cbl -o ledger.cgi
          cobc -x -free seed.cbl -o seed
          cobc -x -free hello.cbl -o hello.cgi

      - name: Run test suite
        run: python -m pytest tests/ -v
        env:
          PYTHON: python
          LEDGER_TEST_BIN: ${{ github.workspace }}/ledger.cgi

      - name: Check operational scripts
        run: shellcheck backup.sh deploy.sh run_demo.sh
