name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: sudo apt-get update && sudo apt-get install -y gnucobol

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile all COBOL sources
        run: |
          cobc -x -free ledger.cbl -o ledger.cgi
          cobc -x -free seed.cbl -o seed
          cobc -x -free hello.cbl -o hello.cgi

      - name: Run test suite
        run: python -m pytest tests/ -v
        env:
          PYTHON: python
