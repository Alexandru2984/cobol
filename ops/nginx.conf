server {
    listen 80;
    listen [::]:80;
    server_name cobol.micutu.com;

    access_log /var/log/nginx/cobol-canary.access.log;
    error_log /var/log/nginx/cobol-canary.error.log warn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cobol.micutu.com;

    access_log /var/log/nginx/cobol-canary.access.log;
    error_log /var/log/nginx/cobol-canary.error.log warn;
    server_tokens off;
    client_max_body_size 4k;

    set $cobol_origin_allowed $from_cloudflare_origin;
    if ($cobol_origin_allowed = 0) {
        return 403;
    }

    ssl_certificate /etc/letsencrypt/live/cobol.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cobol.micutu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cobol_canary_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;


    location / {
        limit_req zone=cobol_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    add_header Cache-Control "no-store, private, no-transform" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;
}
